name: Scan this site

# Runs my own Attack Surface Scanner against richtermax.com once a week
# and commits a small public summary (src/data/scan.json). The Off Track
# hero shows it as a terminal. The commit triggers the redeploy.
# Passive only: DNS, plain GET requests, TLS handshakes.

on:
  schedule:
    # Mondays 05:00 UTC
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanner
        run: pip install "git+https://github.com/richter-max/attack-surface-scanner@main"

      - name: Scan richtermax.com
        run: asm richtermax.com --out scan-out --timeout 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Summarize
        run: node scripts/summarize-scan.mjs scan-out src/data/scan.json

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain src/data/scan.json)" ]]; then
            echo "No changes to scan.json — skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/scan.json
          git commit -m "chore: refresh self-scan ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
