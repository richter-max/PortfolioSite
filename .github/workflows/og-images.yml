name: Link preview images

# Renders one link-preview image per report (public/og/<slug>.png) when a
# report changes, and commits it. Vercel redeploys on that commit.

on:
  push:
    branches: [main]
    paths:
      - 'src/content/reports/**'
      - 'scripts/og-images.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright (not a project dependency)
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Render images
        run: node scripts/og-images.mjs

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain public/og)" ]]; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og
          git commit -m "chore: refresh link preview images"
          git pull --rebase
          git push
