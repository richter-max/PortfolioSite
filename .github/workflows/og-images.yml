name: Link preview images

# Renders one link-preview image per report (public/og/<slug>.png) when a
# report changes, and commits it. Vercel redeploys on that commit.

on:
  push:
    branches: [main]
    paths:
      - 'src/content/reports/**'
      - 'scripts/og-images.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    # pinned: Playwright lists the system packages per Ubuntu release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The runner image ships Google Chrome; Playwright only drives it,
      # so nothing is downloaded or installed system-wide.
      - name: Install Playwright (not a project dependency)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --no-package-lock playwright@1.63.0

      - name: Render images
        env:
          OG_BROWSER_CHANNEL: chrome
        run: node scripts/og-images.mjs

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain public/og)" ]]; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og
          git commit -m "chore: refresh link preview images"
          git pull --rebase
          git push
