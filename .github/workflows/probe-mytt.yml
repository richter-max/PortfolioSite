name: probe mytt (temporary)
on:
  push:
    branches: ['probe/mytt']
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          curl -sSL -A 'richtermax.com season stats (1 request/week)' -o a.html 'https://www.mytischtennis.de/click-tt/spieler/PD9D9D021/spielerportrait'
          python3 - <<'PY'
          import re
          s=open('a.html',encoding='utf-8',errors='ignore').read()
          print('::notice::verify=%d'%('Gleich gehts weiter' in s))
          for m in re.finditer(r'ttr"',s, re.I):
            print('::notice::ctx='+s[max(0,m.start()-500):m.start()+300].replace('%','%25').replace('\n',' '))
          i=s.find('1234'); print('::notice::1234ctx='+re.sub(r'\s+',' ',s[max(0,i-300):i+100]).replace('%','%25'))
          for k in ['singles','balance','bilanz','won','lost','wins']:
            j=s.find('"'+k); 
            if j>=0: print(f'::notice::{k}='+s[max(0,j-200):j+300].replace('%','%25').replace('\n',' '))
          PY
