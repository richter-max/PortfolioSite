name: probe mytt (temporary)
on:
  push:
    branches: ['probe/mytt']
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          code=$(curl -sSL -A 'richtermax.com season stats' -o p.html -w '%{http_code}' 'https://www.mytischtennis.de/click-tt/ByTTV/26--27/ligen/gruppe/523733/mannschaft/3115844/DJK_Seifriedsberg/spielerbilanzen/gesamt')
          echo "::notice::code=$code"
          python3 - <<'PY'
          import re,html as H
          s=open('p.html',encoding='utf-8',errors='ignore').read()
          d=lambda x: re.sub(r'\s+',' ',H.unescape(re.sub(r'<[^>]+>',' ',x))).strip()
          for k,t in enumerate(re.findall(r'<table[\s\S]*?</table>',s)):
            head=[d(h) for h in re.findall(r'<th[^>]*>([\s\S]*?)</th>',t)]
            print(f'::notice::T{k} head='+'|'.join(head))
            for tr in re.findall(r'<tr[^>]*>([\s\S]*?)</tr>',t):
              cells=[d(c) for c in re.findall(r'<t[dh][^>]*>([\s\S]*?)</t[dh]>',tr)]
              if any('Richter' in c for c in cells) or (k>0 and cells and re.search(r'\d+:\d+',' '.join(cells))): print(f'::notice::T{k} row='+'|'.join(cells))
          for m in re.finditer(r'role="group" aria-label="[^"]*"',s): print('::notice::'+m.group(0))
          PY
